<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aisha Mic</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 60px;
      height: 60px;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* ─── Outer glow ring ─── */
    .mic-orb {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
        rgba(167, 139, 250, 0.25) 0%,
        rgba(10, 10, 20, 0.92) 70%
      );
      border: 1.5px solid rgba(167, 139, 250, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.3s ease;
      box-shadow:
        0 0 16px rgba(167, 139, 250, 0.15),
        0 4px 12px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .mic-orb:hover {
      transform: scale(1.08);
      border-color: rgba(167, 139, 250, 0.55);
      box-shadow:
        0 0 24px rgba(167, 139, 250, 0.3),
        0 4px 12px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .mic-orb:active {
      transform: scale(0.95);
    }

    /* ─── Pulse rings (visible when listening) ─── */
    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(167, 139, 250, 0.4);
      opacity: 0;
      pointer-events: none;
    }

    .listening .pulse-ring:nth-child(1) {
      animation: pulse-expand 2s ease-out infinite;
    }

    .listening .pulse-ring:nth-child(2) {
      animation: pulse-expand 2s ease-out 0.6s infinite;
    }

    .listening .pulse-ring:nth-child(3) {
      animation: pulse-expand 2s ease-out 1.2s infinite;
    }

    @keyframes pulse-expand {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* ─── Mic icon ─── */
    .mic-icon {
      width: 22px;
      height: 22px;
      fill: rgba(255, 255, 255, 0.75);
      transition: fill 0.3s ease, filter 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .listening .mic-icon {
      fill: #a78bfa;
      filter: drop-shadow(0 0 6px rgba(167, 139, 250, 0.6));
    }

    /* ─── Inner glow when listening ─── */
    .listening .mic-orb {
      border-color: rgba(167, 139, 250, 0.7);
      background: radial-gradient(circle at 35% 35%,
        rgba(167, 139, 250, 0.35) 0%,
        rgba(15, 10, 30, 0.95) 70%
      );
      box-shadow:
        0 0 28px rgba(167, 139, 250, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.4),
        inset 0 0 12px rgba(167, 139, 250, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: breathe 1.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    /* ─── Status dot ─── */
    .status-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease, box-shadow 0.3s ease;
      z-index: 2;
    }

    .listening .status-dot {
      background: #34d399;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.6);
      animation: dot-blink 1.2s ease-in-out infinite;
    }

    @keyframes dot-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ─── Tooltip ─── */
    .tooltip {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(10, 10, 20, 0.95);
      color: rgba(255, 255, 255, 0.8);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      border: 1px solid rgba(167, 139, 250, 0.15);
    }

    .mic-orb:hover + .tooltip,
    .mic-orb:hover ~ .tooltip {
      /* tooltip is inside the wrapper, so we handle via JS */
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div class="mic-orb" id="mic-orb">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="status-dot"></div>
      <svg class="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
  </div>

  <script>
    const wrapper = document.getElementById('wrapper');
    const micOrb = document.getElementById('mic-orb');

    let listening = false;
    let recognition = null;

    // ─── Web Speech API setup ─────────────────────────────────
    function initRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.error('SpeechRecognition API not available');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'en-IN';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;

      rec.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        const transcript = last[0].transcript;
        const isFinal = last.isFinal;

        // Send interim/final transcript to main process
        window.micAPI.sendTranscript(transcript, isFinal);
      };

      rec.onerror = (event) => {
        console.error('Recognition error:', event.error);
        if (event.error !== 'aborted') {
          stopListening();
        }
      };

      rec.onend = () => {
        // Auto-stop UI when recognition ends naturally
        if (listening) {
          stopListening();
        }
      };

      return rec;
    }

    function startListening() {
      if (!recognition) {
        recognition = initRecognition();
      }
      if (!recognition) return;

      listening = true;
      wrapper.classList.add('listening');
      window.micAPI.sendState(true);

      try {
        recognition.start();
      } catch (e) {
        // Already started
        console.warn('Recognition already running');
      }
    }

    function stopListening() {
      listening = false;
      wrapper.classList.remove('listening');
      window.micAPI.sendState(false);

      if (recognition) {
        try { recognition.stop(); } catch (e) { /* ignore */ }
      }
    }

    // ─── Click handler ────────────────────────────────────────
    micOrb.addEventListener('click', () => {
      if (listening) {
        stopListening();
      } else {
        startListening();
      }
    });

    // ─── Listen for remote activation (Alt+Space shortcut) ───
    window.micAPI.onActivate(() => {
      if (listening) {
        stopListening();
      } else {
        startListening();
      }
    });

    // ─── Listen for force-stop from main process ─────────────
    window.micAPI.onDeactivate(() => {
      if (listening) {
        stopListening();
      }
    });
  </script>
</body>
</html>
