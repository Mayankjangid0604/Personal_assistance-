<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aisha Mini</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .mini-container {
      width: 300px;
      height: 120px;
      background: rgba(10, 10, 20, 0.88);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(167, 139, 250, 0.18);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(167, 139, 250, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
    }

    /* Subtle gradient accent line at top */
    .mini-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 2px;
      background: linear-gradient(90deg, #a78bfa, #6d5acf, #a78bfa);
      border-radius: 0 0 2px 2px;
      opacity: 0.7;
      transition: background 0.4s ease;
    }

    /* ─── Header ─── */
    .mini-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .mini-brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 6px rgba(167, 139, 250, 0.6);
      animation: pulse-dot 2.4s ease-in-out infinite;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .mini-dot--thinking {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      animation: pulse-dot 0.8s ease-in-out infinite;
    }

    .mini-dot--listening {
      background: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(167, 139, 250, 0.6); }
      50%      { opacity: 0.5; box-shadow: 0 0 2px rgba(167, 139, 250, 0.3); }
    }

    .mini-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Handler + emotion badges */
    .mini-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }

    .mini-handler-badge {
      display: none;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      background: rgba(167, 139, 250, 0.12);
      color: #a78bfa;
      border: 1px solid rgba(167, 139, 250, 0.2);
      animation: badge-pop 0.25s ease;
    }

    .mini-handler-badge.visible {
      display: flex;
    }

    .mini-emotion-badge {
      display: none;
      font-size: 12px;
      animation: badge-pop 0.25s ease;
    }

    .mini-emotion-badge.visible {
      display: inline;
    }

    @keyframes badge-pop {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Actions row */
    .mini-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      -webkit-app-region: no-drag;
    }

    .mini-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: rgba(255, 255, 255, 0.45);
      position: relative;
    }

    .mini-btn:hover {
      background: rgba(167, 139, 250, 0.15);
      color: #a78bfa;
      transform: scale(1.08);
    }

    .mini-btn:active {
      transform: scale(0.9);
    }

    .mini-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .mini-btn--active {
      background: rgba(167, 139, 250, 0.2);
      color: #a78bfa;
    }

    .mic-active {
      background: rgba(167, 139, 250, 0.2) !important;
      color: #a78bfa !important;
      animation: mic-glow 1.6s ease-in-out infinite;
    }

    .muted .mini-btn svg {
      opacity: 0.3;
    }

    @keyframes mic-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0); }
      50%      { box-shadow: 0 0 8px 2px rgba(167, 139, 250, 0.25); }
    }

    /* ─── Response Area ─── */
    .mini-response {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
    }

    .mini-response-text {
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.85);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      flex: 1;
    }

    .mini-response-text.placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-style: italic;
    }

    /* ─── Thinking indicator ─── */
    .thinking-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-style: italic;
    }

    .thinking-indicator.active {
      display: flex;
    }

    .thinking-waves {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 14px;
    }

    .thinking-wave {
      width: 2px;
      border-radius: 1px;
      background: #a78bfa;
      animation: wave-bounce 1.2s ease-in-out infinite;
    }

    .thinking-wave:nth-child(1) { height: 6px;  animation-delay: 0s; }
    .thinking-wave:nth-child(2) { height: 10px; animation-delay: 0.12s; }
    .thinking-wave:nth-child(3) { height: 8px;  animation-delay: 0.24s; }
    .thinking-wave:nth-child(4) { height: 12px; animation-delay: 0.36s; }

    @keyframes wave-bounce {
      0%, 100% { transform: scaleY(0.5); opacity: 0.3; }
      50%      { transform: scaleY(1);   opacity: 1; }
    }

    /* ─── Quick actions footer ─── */
    .mini-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .mini-quick-btn {
      border: none;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .mini-quick-btn:hover {
      background: rgba(167, 139, 250, 0.12);
      color: rgba(255, 255, 255, 0.7);
      transform: translateY(-1px);
    }

    .mini-quick-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="mini-container">
    <!-- Header -->
    <div class="mini-header">
      <div class="mini-brand">
        <div class="mini-dot" id="status-dot"></div>
        <span class="mini-title">Aisha</span>
        <div class="mini-meta">
          <span class="mini-handler-badge" id="handler-badge">
            <span id="handler-icon">🧠</span>
            <span id="handler-label">General</span>
          </span>
          <span class="mini-emotion-badge" id="emotion-badge">😐</span>
        </div>
      </div>
      <div class="mini-actions">
        <button class="mini-btn" id="mic-btn" title="Toggle mic">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <button class="mini-btn" id="close-btn" title="Hide (Ctrl+Shift+A)">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>

    <!-- Response content -->
    <div class="mini-response">
      <div class="thinking-indicator" id="thinking-indicator">
        <div class="thinking-waves">
          <div class="thinking-wave"></div>
          <div class="thinking-wave"></div>
          <div class="thinking-wave"></div>
          <div class="thinking-wave"></div>
        </div>
        <span id="thinking-label">Thinking...</span>
      </div>
      <p class="mini-response-text placeholder" id="response-text">Waiting for response…</p>
    </div>

    <!-- Quick actions footer -->
    <div class="mini-footer">
      <button class="mini-quick-btn" id="expand-btn" title="Open main window">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        Expand
      </button>
      <button class="mini-quick-btn" id="mute-btn" title="Mute voice">
        🔊 Voice
      </button>
    </div>
  </div>

  <script>
    const responseText = document.getElementById('response-text');
    const thinkingIndicator = document.getElementById('thinking-indicator');
    const thinkingLabel = document.getElementById('thinking-label');
    const micBtn = document.getElementById('mic-btn');
    const closeBtn = document.getElementById('close-btn');
    const expandBtn = document.getElementById('expand-btn');
    const muteBtn = document.getElementById('mute-btn');
    const statusDot = document.getElementById('status-dot');
    const handlerBadge = document.getElementById('handler-badge');
    const handlerIcon = document.getElementById('handler-icon');
    const handlerLabelEl = document.getElementById('handler-label');
    const emotionBadge = document.getElementById('emotion-badge');

    let micActive = false;
    let voiceMuted = false;

    const HANDLER_MAP = {
      emotion:  { icon: '💜', label: 'Emotion',  color: '#ec4899' },
      task:     { icon: '⚙️', label: 'Task',     color: '#34d399' },
      learning: { icon: '📚', label: 'Learning', color: '#3b82f6' },
      power:    { icon: '⚡', label: 'Power',    color: '#f59e0b' },
      safety:   { icon: '🛡️', label: 'Safety',   color: '#ef4444' },
      general:  { icon: '🧠', label: 'General',  color: '#a78bfa' },
    };

    const EMOTION_MAP = {
      happy: '😊', sad: '😢', stressed: '😰', angry: '😡',
      neutral: '😐', excited: '🤩', calm: '😌',
    };

    // ─── Receive latest response from main process ───
    window.miniAPI.onResponse((text) => {
      thinkingIndicator.classList.remove('active');
      responseText.style.display = '';
      responseText.textContent = text;
      responseText.classList.remove('placeholder');

      // Parse handler from prefixed text: "[Handler] response..."
      const match = text.match(/^\[(\w+)\]\s*/);
      if (match) {
        const handler = match[1].toLowerCase();
        const info = HANDLER_MAP[handler] || HANDLER_MAP.general;
        handlerIcon.textContent = info.icon;
        handlerLabelEl.textContent = info.label;
        handlerBadge.style.color = info.color;
        handlerBadge.style.borderColor = info.color + '33';
        handlerBadge.style.background = info.color + '1a';
        handlerBadge.classList.add('visible');
        responseText.textContent = text.replace(match[0], '');
      }
    });

    // ─── Receive typing state ───
    window.miniAPI.onTyping((isTyping) => {
      if (isTyping) {
        thinkingIndicator.classList.add('active');
        responseText.style.display = 'none';
        statusDot.classList.add('mini-dot--thinking');
      } else {
        thinkingIndicator.classList.remove('active');
        responseText.style.display = '';
        statusDot.classList.remove('mini-dot--thinking');
      }
    });

    // ─── Receive handler info ───
    if (window.miniAPI.onHandler) {
      window.miniAPI.onHandler((handler, emotion) => {
        const info = HANDLER_MAP[handler] || HANDLER_MAP.general;
        handlerIcon.textContent = info.icon;
        handlerLabelEl.textContent = info.label;
        handlerBadge.style.color = info.color;
        handlerBadge.style.borderColor = info.color + '33';
        handlerBadge.style.background = info.color + '1a';
        handlerBadge.classList.add('visible');

        if (emotion && EMOTION_MAP[emotion]) {
          emotionBadge.textContent = EMOTION_MAP[emotion];
          emotionBadge.classList.add('visible');
        }
      });
    }

    // ─── Mic toggle ───
    micBtn.addEventListener('click', () => {
      micActive = !micActive;
      micBtn.classList.toggle('mic-active', micActive);
      statusDot.classList.toggle('mini-dot--listening', micActive);
      window.miniAPI.toggleMic(micActive);
    });

    // ─── Close / hide ───
    closeBtn.addEventListener('click', () => {
      window.miniAPI.hide();
    });

    // ─── Expand main window ───
    expandBtn.addEventListener('click', () => {
      if (window.miniAPI.expandMain) {
        window.miniAPI.expandMain();
      }
    });

    // ─── Mute voice toggle ───
    muteBtn.addEventListener('click', () => {
      voiceMuted = !voiceMuted;
      muteBtn.textContent = voiceMuted ? '🔇 Muted' : '🔊 Voice';
      muteBtn.style.opacity = voiceMuted ? '0.5' : '1';
      if (window.miniAPI.muteVoice) {
        window.miniAPI.muteVoice(voiceMuted);
      }
    });
  </script>
</body>
</html>
